# Repuestos Exactos - PostgreSQL 16 para desarrollo y pruebas.
# El nombre de proyecto es fijo para que contenedor y volumen no dependan
# del nombre de la carpeta.
name: repuestos-exactos-db

services:
  db:
    image: postgres:16
    container_name: repuestos_exactos_db
    # /dev/shm: Docker entrega 64 MB por defecto, que no alcanzan para el VACUUM
    # paralelo ni para consultas paralelas grandes (T-51).
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # pg_hba.conf sin 'trust': tambien el socket local y el loopback del
      # contenedor exigen SCRAM (T-43). Solo se aplica al crear el volumen.
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_statement=none
      # --- Operacion (Fase 6, docs/operacion.md seccion 5) ---
      # Una sentencia que falla no se copia al log: puede llevar una clave literal.
      - -c
      - log_min_error_statement=panic
      # Los parametros de las sentencias preparadas nunca se escriben en el log.
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      # Esperas de bloqueo de mas de deadlock_timeout (1 s).
      - -c
      - log_lock_waits=on
      # Quien y sobre que base: usuario@base antes de cada mensaje.
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d "
    ports:
      # Solo loopback: la base nunca queda expuesta en la red local.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts SQL en solo lectura, para ejecutarlos con el psql 16 del contenedor.
      - ./db:/db:ro
    # El log del servidor sale por stderr y lo guarda Docker: se rota para que
    # no crezca sin limite (5 archivos de 10 MB).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      # -h 127.0.0.1: durante la inicializacion el servidor temporal solo escucha
      # en el socket Unix, asi el contenedor no se reporta sano antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
    name: repuestos_exactos_pgdata
